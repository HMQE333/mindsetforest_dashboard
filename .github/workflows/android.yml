name: Android phone app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Signed with the runner's debug key: this build is for testing only.
      - name: Unit tests and APK
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android
          script: ./smoke-test.sh app/build/outputs/apk/release/app-release.apk

      - name: Keep screenshots and the test APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke
          path: |
            android/smoke/
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/reports/tests/
          if-no-files-found: ignore
