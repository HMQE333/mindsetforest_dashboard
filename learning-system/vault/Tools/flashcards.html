<!-- DATA: { "cards": [ { "front": "question or term", "back": "answer", "idea": "optional" } ] }
     RESULT: { "knew": n, "total": n, "cards": [ { "front", "knew": true|false } ] } -->
<!doctype html>
<html><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { --bg:#0b0b10; --fg:#ececf1; --muted:#8b8d98; --card:#15151c; --line:#2a2a35; --ok:#22c55e; --bad:#ef4444; }
  .light { --bg:#fafafa; --fg:#16161a; --muted:#6b6b76; --card:#fff; --line:#e4e4ea; }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.5 system-ui,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:24px 16px; text-align:center; }
  .meta { color:var(--muted); font-size:13px; }
  .card { margin:16px 0; min-height:200px; display:grid; place-items:center; padding:24px; border-radius:16px; border:1px solid var(--line); background:var(--card); cursor:pointer; font-size:20px; }
  .back { color:var(--muted); font-size:16px; margin-top:12px; }
  .row { display:flex; gap:10px; justify-content:center; }
  .row button { padding:10px 18px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--fg); font:inherit; cursor:pointer; }
  .row .y { border-color:var(--ok); } .row .n { border-color:var(--bad); }
</style></head>
<body><main id="app"></main>
<script>
  if (window.BOARD_THEME === "light") document.documentElement.classList.add("light");
  const cards = (window.BOARD_DATA && window.BOARD_DATA.cards) || [{ front: "No cards were passed.", back: "" }];
  const app = document.getElementById("app");
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const done = [];
  let i = 0, flipped = false;
  function render() {
    if (i >= cards.length) {
      const knew = done.filter((d) => d.knew).length;
      app.innerHTML = `<div class="meta">Done</div><div class="card">${knew} / ${cards.length} known</div>`;
      window.boardResult && window.boardResult({ knew, total: cards.length, cards: done });
      return;
    }
    const c = cards[i];
    app.innerHTML = `<div class="meta">${i + 1} / ${cards.length} · tap or Space to turn</div>
      <div class="card" id="c"><div>${esc(c.front)}${flipped ? `<div class="back">${esc(c.back)}</div>` : ""}</div></div>
      ${flipped ? `<div class="row"><button class="n">Didn't know (1)</button><button class="y">Knew it (2)</button></div>` : ""}`;
    document.getElementById("c").onclick = () => { flipped = !flipped; render(); };
    if (flipped) { app.querySelector(".y").onclick = () => mark(true); app.querySelector(".n").onclick = () => mark(false); }
  }
  function mark(knew) { done.push({ front: cards[i].front, idea: cards[i].idea || null, knew }); i++; flipped = false; render(); }
  document.addEventListener("keydown", (e) => {
    if (e.key === " ") { e.preventDefault(); flipped = !flipped; render(); }
    if (flipped && e.key === "1") mark(false);
    if (flipped && e.key === "2") mark(true);
  });
  render();
</script></body></html>
