  <body>
    <!-- SVG filter for electric border effect -->
    <svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
      <defs>
        <filter id="electric-border-filter" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="turbulence" baseFrequency="0.03 0.06" numOctaves="3" seed="1" result="noise1">
            <animate attributeName="seed" values="1;100;1" dur="6s" repeatCount="indefinite" />
          </feTurbulence>
          <feTurbulence type="fractalNoise" baseFrequency="0.08 0.04" numOctaves="2" seed="5" result="noise2">
            <animate attributeName="seed" values="5;80;5" dur="2s" repeatCount="indefinite" />
          </feTurbulence>
          <feMerge result="combinedNoise">
            <feMergeNode in="noise1" />
            <feMergeNode in="noise2" />
          </feMerge>
          <feDisplacementMap in="SourceGraphic" in2="combinedNoise" scale="6" xChannelSelector="R" yChannelSelector="B" />
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
